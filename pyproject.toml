[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ftcircuitbench"
version = "0.1.0"
description = "A benchmark suite for fault-tolerant quantum circuit compilation and analysis"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

authors = [
    { name = "Adrian Harkness" },
    { name = "Samuel Stein" },
]

keywords = [
    "quantum",
    "quantum-computing",
    "fault-tolerant",
    "circuit-compilation",
    "clifford+t",
    "pauli-based-computation",
    "benchmarking",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    # Pinned deliberately: Qiskit >2.0.2 shows a large performance regression in
    # the transpilation workloads behind benchmark generation. Revisit as
    # upstream performance recovers; uv.lock reproduces the tested environment.
    "qiskit==2.0.2",
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "sympy>=1.14.0",
    "mpmath>=1.3.0",
    "networkx>=3.2.1",
    "matplotlib>=3.9.4",
    "nwqec>=0.1.1",
    "tqdm>=4.67.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
# Azure Quantum Resource Estimator bridge (ftcircuitbench.resource_estimation).
# `qdk` ships the estimator as a local library, so no Azure subscription or
# network access is needed. Kept optional because it pulls a native wheel
# (pyqir) that the rest of the suite does not need. `qdk` supersedes the
# `qsharp` package; the bridge still falls back to `qsharp.estimator` for
# environments that predate the rename.
qre = [
    "qdk>=1.23.0",
]
# Cirq frontend: ingest circuits from any Cirq-based logical-circuit generator
# (Qualtran, pyLIQTR, hand-built Cirq) via OpenQASM 2.
cirq = [
    "cirq-core>=1.4.0",
]
# Qualtran frontend: convert Bloqs to Cirq and on into the FTCircuitBench
# pipeline. Pulls cirq-core transitively.
#
# autoray floor: cotengra (via qualtran -> quimb) calls autoray.get_namespace,
# added in autoray 0.8, but declares no version floor. On Python 3.10 the
# resolver otherwise pairs a current cotengra with autoray 0.7.x, which breaks
# `import cotengra` (and with it these frontends) at runtime.
qualtran = [
    "qualtran>=0.5.0",
    "autoray>=0.8",
]
dev = [
    "pytest>=8.4.0",
    "pytest-mock>=3.14.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.8",
    "pre-commit>=4.0.0",
    "mypy>=1.13.0",
]

[project.urls]
Homepage = "https://github.com/pnnl/FTCircuitBench"
Repository = "https://github.com/pnnl/FTCircuitBench"
Documentation = "https://github.com/pnnl/FTCircuitBench/tree/main/docs"
Issues = "https://github.com/pnnl/FTCircuitBench/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ftcircuitbench*"]
exclude = ["tests*", "misc*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["misc/*.ipynb"]

[tool.ruff.lint]
# "I" is isort; ruff's implementation is black-profile-compatible by default.
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# bench/ is hand-laid-out benchmark code (see [tool.ruff.format] below). These
# two rules are stylistic and would churn that layout: I001 here only wants a
# blank line removed after the import block, and E731 wants the loop-local
# lambda factories rewritten as defs. Correctness rules (F, E4, E9) still apply.
"bench/*" = ["I001", "E731"]

[tool.ruff.format]
# Benchmark specs are hand-aligned into columns for readability; the formatter
# collapses that alignment. Exclude bench/ from formatting only — linting and
# import sorting still apply there.
exclude = ["bench/**"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = false
disallow_untyped_defs = false
strict_optional = true
files = ["ftcircuitbench"]

# Per-module overrides.
#
# pbc_circuit_reader and pbc_generator carry deep type issues (object-typed
# returns from the parser, list[TableauPauliBasis] vs list[TableauForGate]
# mismatches, and float/int unification in stab-count statistics) that require
# an API/data-model review rather than spot fixes. Defer them here so the rest
# of the typecheck job can be a CI gate.
# TODO(typecheck-followup): triage pbc_converter modules in a follow-up.
[[tool.mypy.overrides]]
module = "ftcircuitbench.pbc_converter.pbc_circuit_reader"
ignore_errors = true

[[tool.mypy.overrides]]
module = "ftcircuitbench.pbc_converter.pbc_generator"
ignore_errors = true

[tool.coverage.run]
source = ["ftcircuitbench"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
show_missing = true
